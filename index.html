
<!DOCTYPE html>
<html>
<head>
  <title>My Smart Website</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }
    button {
      padding: 15px 25px;
      margin: 10px;
      background: #00d9ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 id="heading">Hello Abid!</h1>
  <p id="message">Welcome to my website.</p>

  <button onclick="changeText()">Change Text</button>
  <button onclick="changeColor()">Change Background</button>

  <script>
    function changeText() {
      document.getElementById("heading").innerText =
        "JavaScript Successfully Working!";
    }

    function changeColor() {
      document.body.style.background = "#064e3b";
    }
  </script>

</body>
</html>
